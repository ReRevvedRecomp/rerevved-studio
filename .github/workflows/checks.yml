name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install formatting tool
        run: python -m pip install --disable-pip-version-check clang-format==22.1.8
      - name: Check Windows Debug
        shell: pwsh
        run: |
          $pythonScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $env:PATH = "$pythonScripts;C:\Program Files\LLVM\bin;$env:PATH"
          clang --version
          clang-format --version
          .\scripts\verify.ps1 -Preset win-amd64-debug -SkipAppSmoke

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes wget gnupg lsb-release
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install --yes clang-22 lld-22
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 220
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 220
          sudo apt-get install --yes \
            build-essential libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            ninja-build xorg-dev xvfb
          python -m pip install --disable-pip-version-check clang-format==22.1.8
          clang-22 --version
          clang++-22 --version
          clang-format --version
      - name: Check Linux Debug
        run: xvfb-run -a pwsh ./scripts/verify.ps1 -Preset linux-amd64-debug
